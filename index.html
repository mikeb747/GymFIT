  <body>
    <script>
      // Normalizes GitHub Pages path to include trailing slash (/IronFIT/) so PWA manifest scope is isolated from other apps on the domain
      if (window.location.hostname.endsWith('github.io') && window.location.pathname.replace(/\/+$/, '') === '/IronFIT' && !window.location.pathname.endsWith('/')) {
        window.location.replace('/IronFIT/' + window.location.search + window.location.hash);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
